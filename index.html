<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syncify</title>
    <link rel="icon" type="image/x-icon" href="/syncify.ico">
    <!--Put your fonts here!-->

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!--Montserrat (Default/Minimal theme)-->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!--Fraunces (Vinyl theme)-->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap" rel="stylesheet">

    <!--Sora (Aurora theme)-->

    <!--Oswald (Marquee theme)-->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">

    <style>
      /* Centers the widget in the page and keeps it clear of the edges so
         theme drop shadows aren't clipped by the viewport/OBS source bounds. */
      html, body {
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

  </body>
